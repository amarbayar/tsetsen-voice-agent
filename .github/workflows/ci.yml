name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Plain output, so problem matchers can read it.
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Audio (cpal → ALSA) and the keychain (Secret Service → D-Bus).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libdbus-1-dev pkg-config
      # Compiler errors and test panics show up as annotations on the run.
      - run: echo "::add-matcher::.github/rust-matcher.json"
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - run: cargo fmt --all --check
      - shell: bash
        run: .github/scripts/report.sh cargo clippy --workspace --all-targets --message-format=short
      - shell: bash
        run: .github/scripts/report.sh cargo test --workspace
